databaseChangeLog:
  - changeSet:
      id: create-expenses-table
      author: laman
      changes:
        - createTable:
            tableName: expenses
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: expense_type_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: payer
                  type: VARCHAR(255)

              - column:
                  name: date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(255)

              - column:
                  name: receipt_path
                  type: VARCHAR(500)

              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true

        - addForeignKeyConstraint:
            baseTableName: expenses
            baseColumnNames: expense_type_id
            referencedTableName: expense_types
            referencedColumnNames: id
            constraintName: fk_expenses_expense_type