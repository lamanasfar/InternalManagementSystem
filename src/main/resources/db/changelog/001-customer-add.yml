databaseChangeLog:
  - changeSet:
      id: 001-create-customers-table
      author: laman
      changes:
        - createTable:
            tableName: customers
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: object_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: address
                  type: VARCHAR(255)

              - column:
                  name: contact_person
                  type: VARCHAR(255)

              - column:
                  name: birth_date
                  type: DATE

              - column:
                  name: establishment_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: phone_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: anydesk_id
                  type: VARCHAR(255)

              - column:
                  name: company_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false